<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/static/yash.css">
</head>
<body>
    <h2>🔑 Login</h2>
    
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST" action="/login">
        <label>Username:</label>
        <input type="text" name="username" required>
        <br>
        <label>Password:</label>
        <input type="password" name="password" required>
        <br>
        <button type="submit">Login</button>
    </form>

    <p>Don't have an account? <a href="/register">Register here</a></p>

    <hr>
    <p>Or</p>
    <a href="/login/google" style="display:inline-block;background:#fff;border:1px solid #dadce0;color:#3c4043;border-radius:4px;padding:8px 12px;text-decoration:none;">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" style="height:18px;vertical-align:middle;margin-right:8px;">
        Continue with Google
    </a>
</body>
</html>
